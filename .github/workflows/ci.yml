name: C Build, WebAssembly & GitHub Pages CI

on:
  push:
    branches: [ "master", "main", "mcp-ci-test" ]
  pull_request:
    branches: [ "master", "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-linux:
    name: Linux GCC Build & Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses-dev valgrind

    - name: Compile game with make
      run: |
        make

    - name: Verify build artifact
      run: |
        ls -la
        file rogue || true

  build-web:
    name: WebAssembly Build (Emscripten)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Emscripten toolchain
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: 3.1.64

    - name: Verify emcc
      run: emcc -v

    - name: Build WebAssembly with Make
      run: |
        make web

    - name: Verify web artifacts
      run: |
        ls -la web/
        test -f web/index.html
        test -f web/rogue.js
        test -f web/rogue.wasm

    - name: Upload Pages artifact
      if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'web'

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: [build-linux, build-web]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
